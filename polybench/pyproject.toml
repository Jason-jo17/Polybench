[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polybench"
version = "0.1.0"
description = "A polyglot AI coding-benchmark harness"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0,<0.16.0",
    "rich>=13.7.0,<13.8.0",
    "pydantic>=2.7.0,<2.8.0",
    "pydantic-settings>=2.2.0,<3.0.0",
    "sqlmodel>=0.0.21,<0.0.22",
    "anthropic>=0.34.0,<0.35.0",
    "openai>=1.40.0,<1.41.0",
    # anthropic 0.34 and openai 1.40 pass `proxies` to httpx.Client, which httpx
    # 0.28 removed; with 0.28 every provider client fails on construction.
    "httpx>=0.27.0,<0.28.0",
    "jinja2>=3.1.0,<3.2.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.9"
]

[project.scripts]
polybench = "polybench.cli:app"
polybench-mcp = "polybench.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<8.4.0",
    "pytest-cov>=5.0.0,<5.1.0",
    "hypothesis>=6.108.0,<6.109.0",
    "pytest-mock>=3.14.0,<3.15.0",
    "ruff>=0.6.0,<0.7.0",
    "mypy>=1.11.0,<1.12.0",
    "pre-commit>=3.8.0,<3.9.0"
]

[tool.ruff]
target-version = "py312"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
addopts = "--cov=polybench --cov-report=term-missing"
testpaths = ["tests"]
