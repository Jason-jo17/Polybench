name: ci
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  backend:
    name: backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polybench
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install
        run: uv sync --all-extras --dev
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format check)
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy src
      - name: Pytest + coverage gate
        run: uv run pytest --cov=polybench --cov-report=term-missing --cov-fail-under=90

  dashboard:
    name: dashboard (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polybench/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: polybench/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  tasks:
    name: tasks (verify in sandbox)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: polybench
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --all-extras --dev
      - name: Validate task files
        run: uv run polybench tasks validate
      - name: Reference solutions pass, bare signatures fail
        run: uv run polybench tasks verify
